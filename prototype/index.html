<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>译镜 TransLens · 原型</title>
<meta name="description" content="学术文本回译检查与多版本对照工作台（交互原型）。数据仅保存在浏览器本地。">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel-2:#f8f9fb; --hover:#f0f2f5; --hover-strong:#e5e8ec;
  --border:#e2e5ea; --border-strong:#c9ced6;
  --text:#1f2328; --text-2:#57606a; --text-3:#8b949e;
  --accent:#2f6feb; --accent-weak:#e9f0fe; --accent-text:#fff;
  --ins-bg:#d8f5df; --ins-text:#0f5a26; --del-bg:#fde2e1; --del-text:#9a1c1c;
  --hl:#fff1b8; --ph-bg:#eef0f3; --ph-text:#59636e;
  --warn:#9a6700; --warn-bg:#fff8db; --ok:#1a7f37;
  --shadow:0 12px 32px rgba(15,23,42,.16);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --font-read:var(--font-ui);
  --fs:15px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1014; --panel:#151920; --panel-2:#1a1f27; --hover:#1f252e; --hover-strong:#28303b;
    --border:#272d36; --border-strong:#3a424e;
    --text:#e6e8eb; --text-2:#a7b0bb; --text-3:#6e7783;
    --accent:#5b8cff; --accent-weak:#1c2843; --accent-text:#fff;
    --ins-bg:#123622; --ins-text:#86e0a5; --del-bg:#3d1719; --del-text:#ffa3a3;
    --hl:#3d3512; --ph-bg:#232932; --ph-text:#a7b0bb;
    --warn:#e3b341; --warn-bg:#2e2610;
    --shadow:0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1014; --panel:#151920; --panel-2:#1a1f27; --hover:#1f252e; --hover-strong:#28303b;
  --border:#272d36; --border-strong:#3a424e;
  --text:#e6e8eb; --text-2:#a7b0bb; --text-3:#6e7783;
  --accent:#5b8cff; --accent-weak:#1c2843; --accent-text:#fff;
  --ins-bg:#123622; --ins-text:#86e0a5; --del-bg:#3d1719; --del-text:#ffa3a3;
  --hl:#3d3512; --ph-bg:#232932; --ph-text:#a7b0bb;
  --warn:#e3b341; --warn-bg:#2e2610;
  --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.btn{height:28px;padding:0 10px;border:1px solid var(--border);background:var(--panel);border-radius:6px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:#d1242f}
.btn.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.icon{width:28px;padding:0;justify-content:center}
.btn.sm.icon{width:24px}
.sel{height:26px;border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:0 4px;max-width:180px;font-size:12px}
.kbd{font:11px var(--font-mono);color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 4px}

/* top bar */
.topbar{flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.ws-name{color:var(--text-2);padding:2px 6px;border-radius:5px;outline:0;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.ws-name:hover,.ws-name:focus{background:var(--hover)}
.tbgroup{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:8px}
.tbgroup .btn{height:24px;border-color:transparent;background:transparent;padding:0 6px}
.tbgroup .btn:hover{background:var(--hover)}
.tbgroup .btn.on{background:var(--accent-weak);color:var(--accent)}
.sep{width:1px;height:22px;background:var(--border);flex:0 0 1px}
.spacer{flex:1}

/* workspace + layout tree */
#workspace{flex:1;min-height:0;display:flex;padding:6px}
.split{display:flex;flex:1;min-width:0;min-height:0}
.split.row{flex-direction:row}.split.col{flex-direction:column}
.cell{display:flex;min-width:0;min-height:0}
.divider{flex:0 0 6px;position:relative;z-index:2}
.split.row>.divider{cursor:col-resize}.split.col>.divider{cursor:row-resize}
.divider::after{content:"";position:absolute;border-radius:2px;background:transparent;transition:background .12s}
.split.row>.divider::after{top:10px;bottom:10px;left:2px;width:2px}
.split.col>.divider::after{left:10px;right:10px;top:2px;height:2px}
.divider:hover::after,.divider.drag::after{background:var(--accent)}
body.resizing{user-select:none}
body.resizing.rz-col *{cursor:col-resize!important}
body.resizing.rz-row *{cursor:row-resize!important}
body.resizing iframe,body.resizing textarea{pointer-events:none}

.group{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative}
.group.focus{border-color:var(--border-strong)}
.tabbar{flex:0 0 36px;display:flex;align-items:stretch;background:var(--panel-2);border-bottom:1px solid var(--border);min-width:0}
.tabs{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;max-width:210px;border-right:1px solid var(--border);color:var(--text-2);user-select:none;flex:0 0 auto;cursor:default}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--panel);color:var(--text)}
.tab.active::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--tc)}
.tab.dragging{opacity:.45}
.tab.drop-before{box-shadow:inset 2px 0 0 var(--accent)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:0 0 auto}
.tab .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .st{font-size:10px;color:var(--warn)}
.tab .st.run{width:10px;height:10px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.tab .st.err{color:#d1242f}
.tab .base{font-size:10px;color:var(--accent)}
.tab .x{width:18px;height:18px;border:0;background:transparent;border-radius:4px;color:var(--text-3);display:grid;place-items:center;opacity:0;padding:0}
.tab:hover .x,.tab.active .x{opacity:1}
.tab .x:hover{background:var(--hover-strong);color:var(--text)}
.tab input.rename{width:130px;height:22px;border:1px solid var(--accent);border-radius:4px;padding:0 4px;background:var(--panel);outline:0}
.tab-add{border:0;background:transparent;color:var(--text-3);width:30px;flex:0 0 30px;font-size:16px}
.tab-add:hover{color:var(--text);background:var(--hover)}
.tabbar-actions{margin-left:auto;display:flex;align-items:center;gap:1px;padding:0 4px;flex:0 0 auto}
.tabbar-actions .btn{width:26px;height:26px;padding:0;justify-content:center;border-color:transparent;background:transparent;color:var(--text-3)}
.tabbar-actions .btn:hover{background:var(--hover);color:var(--text)}
.drop-ov{position:absolute;pointer-events:none;background:color-mix(in srgb,var(--accent) 14%,transparent);border:2px solid var(--accent);border-radius:8px;display:none;z-index:5;transition:all .08s}
@keyframes spin{to{transform:rotate(360deg)}}

/* tab body */
.tabbody{flex:1;min-height:0;display:flex;flex-direction:column;container-type:inline-size}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{height:24px;padding:0 7px;border:0;background:transparent;color:var(--text-2);font-size:12px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-weak);color:var(--accent)}
.banner{padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--del-bg);color:var(--del-text)}
.banner.info{background:var(--accent-weak);color:var(--accent)}
.banner .btn{height:22px;font-size:12px}
.inner{flex:1;min-height:0;display:flex;flex-direction:column}
.inner.v-row{flex-direction:row}
@container (min-width: 780px){ .inner.v-auto{flex-direction:row} .inner.v-auto>.inner-div{cursor:col-resize;border:0;border-left:1px solid var(--border);border-right:1px solid var(--border)} }
.inner.v-tgt>.pane-src,.inner.v-tgt>.inner-div{display:none}
.inner.v-tgt>.pane-tgt{flex:1 1 0!important}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane>header{flex:0 0 32px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;font-size:12px;color:var(--text-3);min-width:0}
.pane>header b{color:var(--text-2);font-weight:600}
.pane>header .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane>header .acts{margin-left:auto;display:flex;gap:4px;flex:0 0 auto}
.pane .body{flex:1;min-height:0;overflow:auto;padding:4px 14px 28px}
.inner-div{flex:0 0 6px;background:var(--panel-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:row-resize}
.inner.v-row>.inner-div{cursor:col-resize;border:0;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.inner-div:hover,.inner-div.drag{background:var(--accent-weak)}
textarea.src-edit{flex:1;width:100%;border:0;outline:0;resize:none;padding:6px 14px 28px;background:transparent;font:calc(var(--fs) - 1px)/1.75 var(--font-mono);color:var(--text)}
textarea.src-edit::placeholder{color:var(--text-3)}
.text{font-size:var(--fs);line-height:1.85;font-family:var(--font-read);overflow-wrap:anywhere}
.text p{margin:0 0 .9em}
.s{border-radius:3px;transition:background .1s}
.s.hl{background:var(--hl)}
.s.warn{text-decoration:underline wavy var(--warn) 1px;text-underline-offset:4px}
.s.note{color:var(--text-2)}
.note-tag{color:var(--text-3);font-size:.88em}
.ph{display:inline-block;max-width:18em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:-0.35em;font-family:var(--font-mono);font-size:.8em;padding:0 5px;margin:0 1px;border-radius:4px;background:var(--ph-bg);color:var(--ph-text);line-height:1.7}
.ph.lost{border:1px dashed var(--warn);color:var(--warn)}
.pass{font-family:var(--font-mono);font-size:.82em;color:var(--text-3);margin:0 0 .9em;white-space:pre-wrap}
.empty{color:var(--text-3);font-size:13px;padding:28px 8px;text-align:center;line-height:1.9}
.diffview{white-space:pre-wrap}
ins{background:var(--ins-bg);color:var(--ins-text);text-decoration:none;border-radius:3px;padding:0 1px}
del{background:var(--del-bg);color:var(--del-text);text-decoration:line-through;border-radius:3px;padding:0 1px}
.legend{display:inline-flex;gap:6px;align-items:center}
.legend ins,.legend del{font-size:11px;padding:0 4px}
.typing::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* status bar */
.statusbar{flex:0 0 26px;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:12px;color:var(--text-3);background:var(--panel);border-top:1px solid var(--border);white-space:nowrap;overflow:hidden}
.statusbar .lock{color:var(--ok)}

/* menu, toast, modal */
.menu{position:fixed;z-index:60;min-width:190px;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:4px}
.menu button{display:flex;width:100%;border:0;background:transparent;padding:6px 10px;border-radius:6px;text-align:left;gap:8px;align-items:center;color:var(--text)}
.menu button:hover{background:var(--hover)}
.menu button .k{margin-left:auto;color:var(--text-3);font-size:11px}
.menu .colors{display:flex;gap:8px;padding:6px 10px}
.menu .sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--border);cursor:pointer;padding:0}
.menu .sw.on{box-shadow:0 0 0 2px var(--text-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:8px 14px;border-radius:8px;display:flex;gap:14px;align-items:center;z-index:80;box-shadow:var(--shadow);font-size:13px;max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:650;text-decoration:underline;padding:0}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;z-index:50}
.modal{width:min(960px,calc(100vw - 32px));height:min(680px,calc(100vh - 40px));background:var(--panel);border-radius:12px;box-shadow:var(--shadow);display:flex;overflow:hidden;border:1px solid var(--border)}
.modal nav{flex:0 0 172px;background:var(--panel-2);border-right:1px solid var(--border);padding:14px 8px;display:flex;flex-direction:column;gap:2px}
.modal nav .ttl{font-weight:650;padding:0 10px 10px;font-size:14px}
.modal nav button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;color:var(--text-2)}
.modal nav button:hover{background:var(--hover)}
.modal nav button.on{background:var(--accent-weak);color:var(--accent)}
.modal .content{flex:1;overflow:auto;padding:18px 22px 28px;position:relative}
.modal .close{position:absolute;right:12px;top:12px}
.modal h3{margin:0 0 4px;font-size:15px}
.hint{color:var(--text-3);font-size:12px;line-height:1.7}
.field{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:8px 0}
.field>label{color:var(--text-2);font-size:12px}
.input{height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;background:var(--panel);width:100%;min-width:0;outline:0}
.input:focus,.ta:focus{border-color:var(--accent)}
.ta{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--panel);font:12px/1.6 var(--font-mono);resize:vertical;outline:0}
.card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--panel)}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--hover);color:var(--text-2)}
.pill.ok{background:var(--ins-bg);color:var(--ins-text)}
.pill.bad{background:var(--del-bg);color:var(--del-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{border:1px solid var(--border);border-radius:6px;padding:8px 10px;min-height:120px;background:var(--panel-2)}
table.rules{border-collapse:collapse;width:100%;margin-top:8px}
table.rules td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
table.rules td:first-child{color:var(--text-2);width:34%}
table.rules code{font-family:var(--font-mono);font-size:11px;color:var(--text-3)}

@media (max-width: 760px){
  .hide-sm{display:none!important}
  .split.row{flex-direction:column}
  .divider{display:none}
  .modal{flex-direction:column}
  .modal nav{flex-direction:row;flex:0 0 auto;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}
  .modal nav .ttl{display:none}
  .grid2{grid-template-columns:1fr}
  .field{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="logo">译</div>译镜</div>
  <span class="ws-name hide-sm" id="wsName" contenteditable="true" spellcheck="false" title="工作区名称（点击修改）"></span>
  <div class="sep hide-sm"></div>
  <div class="tbgroup hide-sm" id="presets"></div>
  <div class="sep hide-sm"></div>
  <button class="btn sm" id="btnSync" title="同步滚动各窗格">⇅ 同步滚动</button>
  <button class="btn sm" id="btnDiff" title="相对基准标签高亮差异（Alt+D）">≠ 差异</button>
  <div class="spacer"></div>
  <button class="btn primary sm" id="btnAll" title="翻译所有未翻译/已过期的标签（Ctrl/⌘+Shift+Enter）">▶ 全部翻译</button>
  <button class="btn sm icon" id="btnNew" title="新建标签（Alt+T）">＋</button>
  <button class="btn sm icon" id="btnSettings" title="设置">⚙</button>
  <button class="btn sm icon" id="btnTheme" title="主题：自动/浅色/深色">◐</button>
</div>
<div id="workspace"></div>
<div class="statusbar" id="status"></div>

<script>
'use strict';
// ============================================================================
// === CORE START === （与 UI 无关的纯逻辑：LaTeX 处理、分句、提示词、解析、差异）
// ============================================================================
const PH_RE = /⟦(\d+)⟧/g;
const MATH_ENVS = new Set(['equation','equation*','align','align*','gather','gather*','multline','multline*','eqnarray','eqnarray*','displaymath','math','flalign','flalign*','split']);
const FLOAT_ENVS = new Set(['figure','figure*','table','table*','algorithm','algorithm*','wrapfigure','wraptable']);
const OPAQUE_ENVS = { 'tabular':'表格','tabular*':'表格','tabularx':'表格','verbatim':'代码','lstlisting':'代码','minted':'代码','tikzpicture':'图','thebibliography':'参考文献','algorithmic':'算法' };
const LIST_ENVS = new Set(['itemize','enumerate','description']);
const CITE_RE = /^(cite|citep|citet|citealp|citealt|citeauthor|citeyear|parencite|textcite|autocite|footcite)\*?$/;
const REF_RE = /^(ref|eqref|autoref|cref|Cref|pageref|nameref|vref)\*?$/;
const FORMAT_CMDS = new Set(['textbf','textit','emph','underline','textsc','texttt','textsf','textrm','textsl','textup','textmd','mbox','text','uline','hl','caption','enquote']);
const HEADING_CMDS = new Set(['section','subsection','subsubsection','paragraph','subparagraph','chapter','title','section*','subsection*','subsubsection*','chapter*','paragraph*']);
const PREAMBLE_CMDS = new Set(['usepackage','documentclass','newcommand','renewcommand','providecommand','DeclareMathOperator','newtheorem','bibliographystyle','bibliography','maketitle','tableofcontents','input','include','author','date','graphicspath','definecolor']);
const NOARG_DROP = new Set(['noindent','centering','par','newline','linebreak','pagebreak','newpage','clearpage','small','footnotesize','scriptsize','tiny','large','Large','LARGE','huge','normalsize','bfseries','itshape','ttfamily','medskip','smallskip','bigskip','indent','raggedright','raggedleft','hfill','vfill','protect','xspace','appendix','bf','it','rm','sf','tt','em','sc','relax','null','nobreak','allowbreak','sloppy','frenchspacing']);
const ARG_DROP = new Set(['vspace','hspace','vspace*','hspace*','setlength','addtolength','phantom','hphantom','vphantom','includegraphics','thispagestyle','pagestyle','setcounter','addcontentsline','color']);
const SYMBOL_CMDS = { LaTeX:'LaTeX', TeX:'TeX', ldots:'…', dots:'…', textellipsis:'…', etal:'et al.', eg:'e.g.', ie:'i.e.', etc:'etc.', vs:'vs.', wrt:'w.r.t.', textendash:'–', textemdash:'—', S:'§', textbackslash:'\\', textasciitilde:'~', textregistered:'®', copyright:'©', textdegree:'°' };

const DEFAULT_RULES = { inlineMath:'keep', displayMath:'keep', cite:'tag', ref:'key', unknown:'content', float:'caption', opaque:'tag' };

function readGroup(s, i, open = '{', close = '}') {
  let depth = 0;
  for (let k = i; k < s.length; k++) {
    const ch = s[k];
    if (ch === '\\') { k++; continue; }
    if (ch === open) depth++;
    else if (ch === close) { depth--; if (depth === 0) return k; }
  }
  return -1;
}
function findDollar(s, i) {
  for (let k = i; k < s.length; k++) {
    if (s[k] === '\\') { k++; continue; }
    if (s[k] === '$') return k;
    if (s[k] === '\n' && s[k + 1] === '\n') return -1; // 行内公式不跨段落
  }
  return -1;
}
function findEnvEnd(s, from, env) {
  const b = '\\begin{' + env + '}', e = '\\end{' + env + '}';
  let depth = 1, k = from;
  while (k < s.length) {
    const nb = s.indexOf(b, k), ne = s.indexOf(e, k);

  c.append(h('table', { class: 'rules' },
    rule('行内公式', 'inlineMath', [['keep', '保留原样'], ['tag', '显示为 [公式]']], '$x^2$ \\(..\\)'),
    rule('行间公式', 'displayMath', [['keep', '保留原样'], ['tag', '显示为 [公式]'], ['remove', '删除']], 'equation / align / \\[..\\]'),
    rule('文献引用', 'cite', [['tag', '显示为 [引用]'], ['remove', '删除']], '\\cite{..} \\citep{..}'),
    rule('交叉引用', 'ref', [['key', '显示标签名，如 [fig:a]'], ['tag', '显示为 [ref]'], ['remove', '删除']], '\\ref{..} \\eqref{..} \\cref{..}'),
    rule('图表环境', 'float', [['caption', '只保留图注'], ['remove', '删除']], 'figure / table'),
    rule('不可译块', 'opaque', [['tag', '显示为 [表格]/[代码]'], ['remove', '删除']], 'tabular / verbatim / tikzpicture'),
    rule('未知命令', 'unknown', [['content', '保留花括号内的文字'], ['remove', '整体删除']], '\\foo{text}')));
  const macroTa = h('textarea', { class: 'ta', rows: '3', value: state.macros, oninput: e => { state.macros = e.target.value; save(); refresh(); } });
  c.append(h('div', { style: { marginTop: '14px' } }, h('b', {}, '自定义宏'), h('div', { class: 'hint' }, '每行一个，格式 \\宏名 = 展开文本。原文里不带参数的 \\newcommand 会自动识别。'), macroTa));
  const sample = h('textarea', { class: 'ta', rows: '6', value: String.raw`\section{Method}
We build on prior work~\citep{he2016deep} and define the loss as $\mathcal{L} = \sum_i \ell_i$ (Eq.~\eqref{eq:loss}).
\textbf{Importantly}, \ours{} is trained end-to-end\footnote{See Appendix~\ref{app:train}.}. % TODO: cite more
\begin{figure}[t]\centering\includegraphics[width=\linewidth]{arch.pdf}\caption{Overview of \ours{}.}\label{fig:arch}\end{figure}`, oninput: () => refresh() });
  const outClean = h('div', { class: 'preview text', style: { fontSize: '13px' } });
  const outKeep = h('div', { class: 'preview text', style: { fontSize: '13px' } });
  function refresh() {
    const show = mode => {
      const { segs, ph } = buildSegments(sample.value, { mode, rules: state.rules, macros: parseMacroText(state.macros), lang: 'en' });
      return segs.map(s => (s.kind === 'pass' ? `<div class="pass">${segHTML(s.src, ph)}</div>` : `<div style="margin-bottom:6px"><span class="s">${segHTML(s.src, ph)}</span></div>`)).join('');
    };
    outClean.innerHTML = show('clean');
    outKeep.innerHTML = show('keep');
  }
  c.append(h('div', { style: { marginTop: '14px' } }, h('b', {}, '实时预览'), h('div', { class: 'hint' }, '左：原文样例（可修改）。右上：清理模式发送的句子；右下：保留模式（灰色块是占位符，悬停可看原文）。'),
    h('div', { class: 'grid2', style: { marginTop: '6px' } }, sample, h('div', {}, h('div', { class: 'hint' }, '清理模式'), outClean, h('div', { class: 'hint', style: { marginTop: '6px' } }, '保留模式'), outKeep))));
  refresh();
}
function secGlossary(c) {
  c.append(h('h3', {}, '术语表'), h('div', { class: 'hint' }, '每行一条：原文术语 = 指定译法。翻译时只把本次原文里出现的术语注入提示词，节省 token。'));
  c.append(h('div', { class: 'card' },
    h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: state.glossaryOn ? 'checked' : null, onchange: e => { state.glossaryOn = e.target.checked; save(); } }), ' 启用术语表'),
    h('textarea', { class: 'ta', rows: '12', style: { marginTop: '8px' }, value: state.glossary, oninput: e => { state.glossary = e.target.value; save(); } })));
  const t = focusedTab();
  if (t) {
    const pre = h('pre', { class: 'ta', style: { whiteSpace: 'pre-wrap', maxHeight: '260px', overflow: 'auto' } }, buildSystem(t, t.source));
    c.append(h('div', {}, h('b', {}, `当前标签「${t.title}」实际发送的系统提示词`), pre));
  }
}
function secAppearance(c) {
  c.append(h('h3', {}, '外观'),
    h('div', { class: 'field' }, h('label', {}, '主题'), h('select', { class: 'sel', value: state.ui.theme, onchange: e => { state.ui.theme = e.target.value; save(); applyAppearance(); } }, h('option', { value: 'auto' }, '跟随系统'), h('option', { value: 'light' }, '浅色'), h('option', { value: 'dark' }, '深色'))),
    h('div', { class: 'field' }, h('label', {}, '正文字号'), h('div', { class: 'row', style: { display: 'flex', gap: '8px', alignItems: 'center' } },
      h('input', { type: 'range', min: '12', max: '22', value: String(state.ui.fs), oninput: e => { state.ui.fs = +e.target.value; e.target.nextSibling.textContent = state.ui.fs + 'px'; save(); applyAppearance(); } }), h('span', {}, state.ui.fs + 'px'))),
    h('div', { class: 'field' }, h('label', {}, '正文字体'), h('select', { class: 'sel', value: state.ui.font, onchange: e => { state.ui.font = e.target.value; save(); applyAppearance(); } }, h('option', { value: 'sans' }, '无衬线'), h('option', { value: 'serif' }, '衬线'))),
    h('div', { class: 'hint', style: { marginTop: '16px' } }, '快捷键：Ctrl/⌘+Enter 翻译 · Ctrl/⌘+Shift+Enter 全部翻译 · Alt+T 新建标签 · Alt+W 关闭标签 · Ctrl/⌘+\\ 向右拆分 · Ctrl/⌘+Shift+\\ 向下拆分 · F2 重命名 · Alt+1…9 切换标签 · Alt+D 差异开关 · Esc 退出编辑'));
}
function secData(c) {
  const size = new Blob([JSON.stringify(state)]).size;
  const incl = h('input', { type: 'checkbox' });
  c.append(h('h3', {}, '数据与隐私'),
    h('div', { class: 'hint' }, '本站没有后端、账号或统计脚本。标签、译文、设置都保存在本浏览器（原型用 localStorage，正式版用 IndexedDB）。网络请求只有一种：从浏览器发往你配置的模型服务。清理浏览器数据会丢失内容，请定期导出备份。'),
    h('div', { class: 'card' }, h('div', { class: 'row' }, h('span', {}, `当前占用约 ${(size / 1024).toFixed(1)} KB · ${Object.keys(state.tabs).length} 个标签 · ${state.providers.length} 个模型服务`))),
    h('div', { class: 'card' },
      h('div', { class: 'row' },
        h('button', { class: 'btn sm primary', onclick: () => {
          const data = JSON.parse(JSON.stringify(state));
          if (!incl.checked) data.providers.forEach(p => { p.apiKey = ''; });
          const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })), download: `translens-backup-${new Date().toISOString().slice(0, 10)}.json` });
          a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        } }, '导出备份 JSON'),
        h('label', { class: 'row' }, incl, ' 包含 API Key'))),
    h('div', { class: 'card' },
      h('div', { class: 'row' },
        h('label', { class: 'btn sm' }, '从备份导入…', h('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' }, onchange: async e => {
          const f = e.target.files[0]; if (!f) return;
          try {
            const s = JSON.parse(await f.text());
            if (s.version !== 1 || !s.tabs || !s.layout) throw new Error('格式不正确');
            const keys = Object.fromEntries(state.providers.map(p => [p.id, p.apiKey]));
            s.providers.forEach(p => { if (!p.apiKey && keys[p.id]) p.apiKey = keys[p.id]; });
            state = s; save(); closeSettings(); toast('已导入备份');
          } catch (err) { toast('导入失败：' + err.message); }
        } })),
        h('span', { class: 'hint' }, '导入会替换当前全部内容'))),
    h('div', { class: 'card' },
      h('div', { class: 'row' },
        h('button', { class: 'btn sm danger', onclick: () => { if (confirm('确定清除本浏览器中的全部标签、译文和设置（包括 API Key）？此操作无法撤销。')) { localStorage.removeItem(STORE_KEY); location.reload(); } } }, '清除全部数据'),
        h('button', { class: 'btn sm', onclick: () => { if (confirm('恢复为内置示例？当前内容会被替换（模型服务保留）。')) { const keep = state.providers; state = initialState(); state.providers = keep; save(); closeSettings(); } } }, '恢复示例'))));
}

// ============================================================================
// 事件与快捷键
// ============================================================================
$('#btnSync').onclick = () => { state.ui.sync = !state.ui.sync; save(); renderTopbar(); toast(state.ui.sync ? '已开启同步滚动' : '已关闭同步滚动'); };
$('#btnDiff').onclick = () => toggleDiff();
$('#btnAll').onclick = () => translateAll();
$('#btnNew').onclick = () => { addTab(); save(); renderAll(); focusEditor(); };
$('#btnSettings').onclick = () => openSettings();
$('#btnTheme').onclick = () => { state.ui.theme = { auto: 'light', light: 'dark', dark: 'auto' }[state.ui.theme]; save(); applyAppearance(); toast('主题：' + { auto: '跟随系统', light: '浅色', dark: '深色' }[state.ui.theme]); };
$('#wsName').addEventListener('input', e => { state.wsName = e.target.textContent.trim() || '未命名工作区'; save(); });
$('#wsName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
function toggleDiff() {
  state.ui.diff = !state.ui.diff;
  if (!state.tabs[state.ui.baseTabId]) state.ui.baseTabId = orderedTabIds()[0];
  save(); renderAll();
  if (state.ui.diff) toast(`差异：相对「${state.tabs[state.ui.baseTabId].title}」高亮（右键标签可更换基准）`);
}
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') { if (menuEl) { closeMenu(); return; } if ($('.modal-bg')) { closeSettings(); return; } }
  if ($('.modal-bg')) return;
  const tab = focusedTab(), g = focusedGroup();
  if (mod && e.key === 'Enter') { e.preventDefault(); if (e.shiftKey) translateAll(); else if (tab) translateTab(tab.id); return; }
  if (mod && e.code === 'Backslash') { e.preventDefault(); if (g) splitWithNew(g.id, e.shiftKey ? 'col' : 'row'); return; }
  if (e.altKey && !mod && e.code === 'KeyT') { e.preventDefault(); addTab(); save(); renderAll(); focusEditor(); return; }
  if (e.altKey && !mod && e.code === 'KeyW') { e.preventDefault(); if (tab) closeTab(tab.id); return; }
  if (e.altKey && !mod && e.code === 'KeyD') { e.preventDefault(); toggleDiff(); return; }
  if (e.altKey && !mod && /^Digit[1-9]$/.test(e.code)) {
    e.preventDefault();
    const id = orderedTabIds()[+e.code.slice(5) - 1];
    const tg = id && groupOfTab(id);
    if (tg) { tg.active = id; state.focusGroup = tg.id; save(); renderAll(); }
    return;
  }
  if (e.key === 'F2' && tab) { e.preventDefault(); startRename(tab.id); }
});
window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue) { const s = load(); if (s) { state = s; renderAll(); } } });

renderAll();
</script>
